<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KGH // Live Projector</title><style>
:root{--bg:#05060a;--panel:#0b1019;--panel2:#0f1724;--line:#263247;--text:#eef2f7;--muted:#8290a5;--orange:#ff7a00;--cyan:#22d3ee;--gold:#ffc20a;--red:#ff3b30;--green:#42e695}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}.grid{position:fixed;inset:0;pointer-events:none;opacity:.42;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:44px 44px}
.scan{position:fixed;left:0;right:0;top:-10%;height:20%;pointer-events:none;background:linear-gradient(transparent,#22d3ee12,transparent);animation:scan 7s linear infinite;z-index:0}
.shell{position:relative;z-index:1;width:min(1180px,calc(100% - 32px));margin:auto;padding:26px 0 70px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-size:11px;font-weight:900;letter-spacing:.18em;color:var(--orange)}
.status{font-size:9px;letter-spacing:.12em;color:var(--cyan);border:1px solid #18556a;padding:9px 11px;background:#07131a}
.panel{background:linear-gradient(145deg,#0f1724f2,#080c14f2);border:1px solid var(--line);box-shadow:0 20px 70px #0008}
.eyebrow{font-size:10px;font-weight:900;letter-spacing:.25em;color:var(--cyan)}
button{font:inherit}.btn{border:1px solid var(--orange);background:var(--orange);color:#080b10;padding:14px 18px;font-size:10px;font-weight:900;letter-spacing:.08em;cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 35px #ff7a0033}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}.btn.secondary{background:transparent;color:var(--text);border-color:var(--line)}
.small{font-size:10px;color:var(--muted);line-height:1.65}.hidden{display:none!important}
@keyframes scan{to{transform:translateY(600%)}}@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}@keyframes pulse{50%{opacity:.45}}@keyframes spin{to{transform:rotate(360deg)}}

html,body{width:100%;height:100%;overflow:hidden}body{background:radial-gradient(circle at 50% 35%,#15111a,#05060a 62%)}.project{height:100vh;padding:30px 42px;display:grid;grid-template-rows:auto 1fr auto;gap:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:20px}.live{font-size:12px;color:var(--red);font-weight:900;letter-spacing:.15em;animation:pulse 1.4s infinite}
.main{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;min-height:0}.hero{display:grid;place-items:center;text-align:center;padding:20px;animation:rise .7s ease}.hero .eyebrow{font-size:clamp(11px,1.3vw,18px)}.hero h1{font-size:clamp(58px,10vw,150px);line-height:.78;letter-spacing:-.07em;margin:25px 0}.hero h1 span{color:var(--orange)}.round{font-size:clamp(18px,2.4vw,34px);font-weight:900;color:var(--gold);letter-spacing:.12em}
.board{padding:25px;min-height:0;overflow:hidden;animation:rise .9s ease}.board h2{font-size:clamp(18px,2vw,28px);margin:0 0 18px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.metric{padding:15px;background:#090e16;border:1px solid var(--line)}.metric small{display:block;color:var(--muted);font-size:9px}.metric strong{display:block;font-size:clamp(24px,3vw,42px);color:var(--gold);margin-top:5px}.leader{display:grid;gap:8px;max-height:48vh;overflow:hidden}.row{display:grid;grid-template-columns:55px 1fr 110px;align-items:center;gap:12px;padding:13px 12px;background:#090e16;border:1px solid var(--line);font-size:clamp(12px,1.3vw,18px)}.rank{color:var(--orange);font-weight:900}.points{text-align:right;color:var(--gold);font-weight:900}.announce{border-top:1px solid var(--line);padding-top:15px;display:flex;justify-content:space-between;gap:20px;align-items:center}.announce strong{font-size:clamp(12px,1.5vw,20px)}.clock{font-variant-numeric:tabular-nums;color:var(--cyan);font-weight:900}.empty{color:var(--muted);font-size:13px;padding:20px 0}@media(max-width:900px){.project{padding:20px}.main{grid-template-columns:1fr}.hero{display:none}.leader{max-height:55vh}}
</style></head><body>
<div class="grid"></div><div class="scan"></div>
<main class="project"><header class="head"><div><div class="brand">KRAVEN'S GATE HEIST // LIVE MISSION CONTROL</div><div class="live">● LIVE EVENT DISPLAY</div></div><div class="clock" id="clock">--:--:--</div></header>
<section class="main"><section class="hero"><div><div class="eyebrow">SECURE SYMPOSIUM EVENT</div><h1>THE HEIST<br><span>IS ON.</span></h1><div class="round" id="round">WAITING FOR MISSION CONTROL</div></div></section>
<section class="panel board"><h2>LIVE LEADERBOARD</h2><div class="metrics"><div class="metric"><small>PARTICIPATING</small><strong id="teams">—</strong></div><div class="metric"><small>QUALIFIED</small><strong id="qualified">—</strong></div><div class="metric"><small>ACTIVE</small><strong id="active">—</strong></div></div><div class="leader" id="leader"><div class="empty">Waiting for live event data...</div></div></section></section>
<footer class="announce"><div><div class="eyebrow">MISSION ALERT</div><strong id="announcement">WAITING FOR MISSION CONTROL</strong></div><div class="clock" id="sync">SYNC —</div></footer></main>
<script>
const $=id=>document.getElementById(id);function tick(){$('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
async function sync(){try{const r=await fetch('/api/projector/state',{credentials:'same-origin',cache:'no-store'});if(!r.ok){$('sync').textContent='SYNC — OFFLINE';return}const d=await r.json();$('round').textContent=d.roundName||d.round||'MISSION CONTROL STANDBY';$('announcement').textContent=d.announcement||'MISSION CONTROL STANDBY';$('teams').textContent=d.totalTeams??d.teams??'—';$('qualified').textContent=d.qualifiedTeams??d.qualified??'—';$('active').textContent=d.activeTeams??d.active??'—';const rows=d.leaderboard||d.teamsList||[];$('leader').innerHTML=rows.length?rows.slice(0,10).map((x,i)=>'<div class="row"><span class="rank">'+(i+1)+'</span><span>'+esc(x.teamName||x.team_name||x.name||'TEAM')+'</span><span class="points">'+Number(x.score||x.points||0).toLocaleString()+'</span></div>').join(''):'<div class="empty">No leaderboard data available.</div>';$('sync').textContent='SYNC '+new Date().toLocaleTimeString()}catch(e){$('sync').textContent='SYNC — OFFLINE'}}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}tick();setInterval(tick,1000);sync();setInterval(sync,7000);
</script></body></html>
